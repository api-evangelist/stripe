aid: stripe
url: https://raw.githubusercontent.com/api-search/payments/main/_apis/stripe/apis.md
apis:
- aid: stripe:stripe-accounts-api
  name: Stripe Accounts API
  tags:
  - Accounts
  properties:
  - url: https://stripe.com/docs/api/accounts
    type: Documentation
  - url: https://docs.stripe.com/api/accounts
    type: APIReference
  - url: openapi/stripe-accounts-api-openapi.yml
    type: OpenAPI
  - url: graphql/stripe-graphql.md
    type: GraphQL
  - url: overlays/stripe-accounts-overlay.yaml
    type: Overlay
  description: >-
    This is an object representing a Stripe account. You can retrieve it to see properties on the account
    like its current requirements or if the account is enabled to make live charges or receive payouts.
- aid: stripe:stripe-balance-api
  name: Stripe Balance API
  tags:
  - Balance
  - History
  - Transactions
  properties:
  - url: https://stripe.com/docs/api/balance
    type: Documentation
  - url: https://docs.stripe.com/api/balance
    type: APIReference
  - url: openapi/stripe-balance-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-balance-overlay.yaml
    type: Overlay
  description: >-
    This is an object representing your Stripe balance. You can retrieve it to see the balance currently
    on your Stripe account. You can also retrieve the balance history, which contains a list of transactions
    that contributed to the balance (charges, payouts, and so forth).
- aid: stripe:stripe-billing-api
  name: Stripe Billing API
  tags:
  - Billing
  properties:
  - url: https://stripe.com/docs/billing
    type: Documentation
  - url: openapi/stripe-billing-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-billing-overlay.yaml
    type: Overlay
  description: Create and manage subscriptions, recurring payments, and recurring revenue.
- aid: stripe:stripe-charges-api
  name: Stripe Charges API
  tags:
  - Charges
  - Disputes
  - Refunds
  properties:
  - url: https://stripe.com/docs/api/charges
    type: Documentation
  - url: https://docs.stripe.com/api/charges
    type: APIReference
  - url: openapi/stripe-charges-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-charges-overlay.yaml
    type: Overlay
  description: >-
    The Charge object represents a single attempt to move money into your Stripe account. PaymentIntent
    confirmation is the most common way to create Charges, but transferring money to a different Stripe
    account through Connect also creates Charges. Some legacy payment flows create Charges directly, which
    is not recommended for new integrations.
- aid: stripe:stripe-checkout-api
  name: Stripe Checkout API
  tags:
  - Checkout
  properties:
  - url: https://stripe.com/docs/payments/checkout
    type: Documentation
  - url: openapi/stripe-checkout-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-checkout-overlay.yaml
    type: Overlay
  description: >-
    Checkout is a low-code payment integration that creates a customizable form for collecting payments.
    You can embed Checkout directly in your website or redirect customers to a Stripe-hosted payment page.
    It supports one-time payments and subscriptions and accepts over 40 local payment methods.
- aid: stripe:stripe-climate-api
  name: Stripe Climate API
  tags:
  - Carbon
  - Climate
  properties:
  - url: https://stripe.com/climate
    type: Documentation
  - url: openapi/stripe-climate-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-climate-overlay.yaml
    type: Overlay
  description: >-
    Stripe Climate is the easiest way to help promising permanent carbon removal technologies launch and
    scale. Join a growing group of ambitious businesses that are changing the course of carbon removal.
- aid: stripe:stripe-country-api
  name: Stripe Country API
  tags:
  - Countries
  properties:
  - url: https://stripe.com/docs/api/country_specs
    type: Documentation
  - url: openapi/stripe-country-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-country-overlay.yaml
    type: Overlay
  description: >-
    Stripe needs to collect certain pieces of information about each account created. These requirements
    can differ depending on the account's country. The Country Specs API makes these rules available to
    your integration.
- aid: stripe:stripe-coupons-api
  name: Stripe Coupons API
  tags:
  - Coupons
  properties:
  - url: https://stripe.com/docs/api/coupons
    type: Documentation
  - url: openapi/stripe-coupons-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-coupons-overlay.yaml
    type: Overlay
  description: >-
    A coupon contains information about a percent-off or amount-off discount you might want to apply to
    a customer. Coupons may be applied to subscriptions, invoices, checkout sessions, quotes, and more.
    Coupons do not work with conventional one-off charges or payment intents.
- aid: stripe:stripe-credit-notes-api
  name: Stripe Credit Notes API
  tags:
  - Credit
  - Notes
  properties:
  - url: https://stripe.com/docs/api/credit_notes
    type: Documentation
  - url: openapi/stripe-credit-notes-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-credit-notes-overlay.yaml
    type: Overlay
  description: Issue a credit note to adjust an invoice's amount after the invoice is finalized.
- aid: stripe:stripe-customers-api
  name: Stripe Customers API
  tags:
  - Customers
  properties:
  - url: https://stripe.com/docs/api/customers
    type: Documentation
  - url: https://docs.stripe.com/api/customers
    type: APIReference
  - url: openapi/stripe-customers-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-customers-overlay.yaml
    type: Overlay
  description: >-
    This object represents a customer of your business. Use it to create recurring charges and track payments
    that belong to the same customer.
- aid: stripe:stripe-disputes-api
  name: Stripe Disputes API
  tags:
  - Disputes
  properties:
  - url: https://stripe.com/docs/api/disputes
    type: Documentation
  - url: https://docs.stripe.com/api/disputes
    type: APIReference
  - url: openapi/stripe-disputes-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-disputes-overlay.yaml
    type: Overlay
  description: >-
    A dispute occurs when a customer questions your charge with their card issuer. When this happens,
    you have the opportunity to respond to the dispute with evidence that shows that the charge is legitimate.
- aid: stripe:stripe-ephemeral-keys-api
  name: Stripe Ephemeral Keys API
  tags:
  - Ephemeral
  - Keys
  properties:
  - url: https://stripe.com/docs/issuing/elements
    type: Documentation
  - url: openapi/stripe-ephemeral-keys-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-ephemeral-keys-overlay.yaml
    type: Overlay
  description: >-
    Stripe.js uses ephemeral keys to securely retrieve Card information from the Stripe API without publicly
    exposing your secret keys. You need to do some of the ephemeral key exchange on the server-side to
    set this up.
- aid: stripe:stripe-events-api
  name: Stripe Events API
  tags:
  - Events
  properties:
  - url: https://stripe.com/docs/api/events
    type: Documentation
  - url: https://docs.stripe.com/api/events
    type: APIReference
  - url: openapi/stripe-events-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-events-overlay.yaml
    type: Overlay
  description: >-
    Events are our way of letting you know when something interesting happens in your account. When an
    interesting event occurs, we create a new Event object.
- aid: stripe:stripe-exchange-rates-api
  name: Stripe Exchange Rates API
  tags:
  - Exchanges
  - Rates
  properties:
  - url: https://stripe.com/docs/currencies/conversions
    type: Documentation
  - url: openapi/stripe-exchange-rates-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-exchange-rates-overlay.yaml
    type: Overlay
  description: >-
    Stripe supports processing charges in 135+ currencies allowing you to present prices in a customer's
    native currency. Doing so can improve sales and help customers avoid conversion costs. In order to
    present prices in your customer's currency, you need to specify the presentment currency when creating
    a PaymentIntent or a charge.
- aid: stripe:stripe-files-api
  name: Stripe Files API
  tags:
  - Files
  properties:
  - url: https://stripe.com/docs/api/files
    type: Documentation
  - url: https://docs.stripe.com/api/files
    type: APIReference
  - url: openapi/stripe-files-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-files-overlay.yaml
    type: Overlay
  description: >-
    This object represents files hosted on Stripe's servers. You can upload files with the create file
    request (for example, when uploading dispute evidence). Stripe also creates files independently (for
    example, the results of a Sigma scheduled query).
- aid: stripe:stripe-financial-connections-api
  name: Stripe Financial Connections API
  tags:
  - Connections
  - Financial
  properties:
  - url: https://stripe.com/docs/financial-connections
    type: Documentation
  - url: openapi/stripe-financial-connections-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-financial-connections-overlay.yaml
    type: Overlay
  description: >-
    Financial Connections lets your users securely share their financial data by linking their financial
    accounts to your business. Use Financial Connections to access user-permissioned account data such
    as tokenized account and routing numbers, balances, ownerships details, and transactions.
- aid: stripe:stripe-identity-api
  name: Stripe Identity API
  tags:
  - Cancel
  - Entities
  - Identity
  - Redact
  - Reports
  - Sessions
  - Verification
  properties:
  - url: https://stripe.com/docs/identity
    type: Documentation
  - url: openapi/stripe-identity-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-identity-overlay.yaml
    type: Overlay
  description: >-
    Use Stripe Identity to confirm the identity of global users to prevent fraud, streamline risk operations,
    and increase trust and safety.
- aid: stripe:stripe-invoice-api
  name: Stripe Invoice API
  tags:
  - Invoices
  properties:
  - url: https://stripe.com/docs/api/invoices
    type: Documentation
  - url: https://docs.stripe.com/api/invoices
    type: APIReference
  - url: openapi/stripe-invoice-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-invoice-overlay.yaml
    type: Overlay
  description: >-
    Invoices are statements of amounts owed by a customer, and are either generated one-off, or generated
    periodically from a subscription.
- aid: stripe:stripe-issuing-api
  name: Stripe Issuing API
  tags:
  - Cards
  - Issuing
  properties:
  - url: https://stripe.com/docs/issuing
    type: Documentation
  - url: openapi/stripe-issuing-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-issuing-overlay.yaml
    type: Overlay
  description: An API for businesses to instantly create, manage, and distribute payment cards.
- aid: stripe:stripe-link-api
  name: Stripe Link API
  tags:
  - Links
  - Payments
  properties:
  - url: https://stripe.com/docs/payment-links/api
    type: Documentation
  - url: openapi/stripe-link-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-link-overlay.yaml
    type: Overlay
  description: >-
    You can use the Payment Links API to create a payment link that you can share with your customers.
    Stripe redirects customers who open this link to a Stripe-hosted payment page.
- aid: stripe:stripe-payment-intents-api
  name: Stripe Payment Intents API
  tags:
  - Intent
  - Intents
  - Payments
  properties:
  - url: https://stripe.com/docs/api/payment_intents
    type: Documentation
  - url: https://docs.stripe.com/api/payment_intents
    type: APIReference
  - url: openapi/stripe-payment-intents-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-payment-intents-overlay.yaml
    type: Overlay
  description: >-
    A PaymentIntent guides you through the process of collecting a payment from your customer. We recommend
    that you create exactly one PaymentIntent for each order or customer session in your system. You can
    reference the PaymentIntent later to see the history of payment attempts for a particular session.
- aid: stripe:stripe-payment-links-api
  name: Stripe Payment Links API
  tags:
  - Link
  - Links
  - Payments
  properties:
  - url: https://stripe.com/docs/api/payment_links/payment_links
    type: Documentation
  - url: openapi/stripe-payment-links-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-payment-links-overlay.yaml
    type: Overlay
  description: >-
    A payment link is a shareable URL that will take your customers to a hosted payment page. A payment
    link can be shared and used multiple times. When a customer opens a payment link it will open a new
    checkout session to render the payment page. You can use checkout session events to track payments
    through payment links.
- aid: stripe:stripe-payouts-api
  name: Stripe Payouts API
  tags:
  - Payouts
  properties:
  - url: https://stripe.com/docs/api/payouts
    type: Documentation
  - url: https://docs.stripe.com/api/payouts
    type: APIReference
  - url: openapi/stripe-payouts-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-payouts-overlay.yaml
    type: Overlay
  description: >-
    A Payout object is created when you receive funds from Stripe, or when you initiate a payout to either
    a bank account or debit card of a connected Stripe account. You can retrieve individual payouts, and
    list all payouts. Payouts are made on varying schedules, depending on your country and industry.
- aid: stripe:stripe-plans-api
  name: Stripe Plans API
  tags:
  - Plan
  - Plans
  properties:
  - url: https://stripe.com/docs/api/plans
    type: Documentation
  - url: openapi/stripe-plans-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-plans-overlay.yaml
    type: Overlay
  description: >-
    You can now model subscriptions more flexibly using the Prices API. It replaces the Plans API and
    is backwards compatible to simplify your migration.
- aid: stripe:stripe-prices-api
  name: Stripe Prices API
  tags:
  - Prices
  properties:
  - url: https://stripe.com/docs/api/prices
    type: Documentation
  - url: https://docs.stripe.com/api/prices
    type: APIReference
  - url: openapi/stripe-prices-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-prices-overlay.yaml
    type: Overlay
  description: >-
    Prices define the unit cost, currency, and (optional) billing cycle for both recurring and one-time
    purchases of products. Products help you track inventory or provisioning, and prices help you track
    payment terms. Different physical goods or levels of service should be represented by products, and
    pricing options should be represented by prices. This approach lets you change prices without having
    to change your provisioning scheme.
- aid: stripe:stripe-products-api
  name: Stripe Products API
  tags:
  - Products
  properties:
  - url: https://stripe.com/docs/api/products
    type: Documentation
  - url: https://docs.stripe.com/api/products
    type: APIReference
  - url: openapi/stripe-products-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-products-overlay.yaml
    type: Overlay
  description: >-
    Products describe the specific goods or services you offer to your customers. For example, you might
    offer a Standard and Premium version of your goods or service; each version would be a separate Product.
    They can be used in conjunction with Prices to configure pricing in Payment Links, Checkout, and Subscriptions.
- aid: stripe:stripe-promotion-codes-api
  name: Stripe Promotion Codes API
  tags:
  - Codes
  - Promotion
  - Promotions
  properties:
  - url: https://stripe.com/docs/api/promotion_codes
    type: Documentation
  - url: openapi/stripe-promotion-codes-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-promotion-codes-overlay.yaml
    type: Overlay
  description: >-
    A Promotion Code represents a customer-redeemable code for a coupon. It can be used to create multiple
    codes for a single coupon.
- aid: stripe:stripe-quotes-api
  name: Stripe Quotes API
  tags:
  - Quotes
  properties:
  - url: https://stripe.com/docs/api/quotes
    type: Documentation
  - url: openapi/stripe-quotes-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-quotes-overlay.yaml
    type: Overlay
  description: >-
    A Quote is a way to model prices that you'd like to provide to a customer. Once accepted, it will
    automatically create an invoice, subscription or subscription schedule.
- aid: stripe:stripe-radar-api
  name: Stripe Radar API
  tags:
  - Fraud
  - Radar
  properties:
  - url: https://stripe.com/docs/radar
    type: Documentation
  - url: openapi/stripe-radar-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-radar-overlay.yaml
    type: Overlay
  description: >-
    Stripe Radar provides real-time fraud protection and requires no additional development time. Fraud
    professionals can add Radar for Fraud Teams to customize protection and get deeper insights.
- aid: stripe:stripe-refunds-api
  name: Stripe Refunds API
  tags:
  - Refunds
  properties:
  - url: https://stripe.com/docs/api/refunds
    type: Documentation
  - url: https://docs.stripe.com/api/refunds
    type: APIReference
  - url: openapi/stripe-refunds-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-refunds-overlay.yaml
    type: Overlay
  description: >-
    Refund objects allow you to refund a previously created charge that isn't refunded yet. Funds are
    refunded to the credit or debit card that's initially charged.
- aid: stripe:stripe-reporting-api
  name: Stripe Reporting API
  tags:
  - Reporting
  - Reports
  properties:
  - url: https://stripe.com/docs/reports/api
    type: Documentation
  - url: openapi/stripe-reporting-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-reporting-overlay.yaml
    type: Overlay
  description: >-
    The financial reports in the Dashboard provide downloadable reports in CSV format for a variety of
    accounting and reconciliation tasks. These reports are also available through the API, so you can
    schedule them to run automatically or run them whenever you need to receive the associated report
    files for accounting purposes.
- aid: stripe:stripe-reviews-api
  name: Stripe Reviews API
  tags:
  - Reviews
  properties:
  - url: https://stripe.com/docs/api/radar/reviews
    type: Documentation
  - url: openapi/stripe-reviews-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-reviews-overlay.yaml
    type: Overlay
  description: Reviews can be used to supplement automated fraud detection with human expertise.
- aid: stripe:stripe-shipping-rates-api
  name: Stripe Shipping Rates API
  tags:
  - Rates
  - Shipping
  properties:
  - url: https://stripe.com/docs/api/shipping_rates
    type: Documentation
  - url: openapi/stripe-shipping-rates-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-shipping-rates-overlay.yaml
    type: Overlay
  description: >-
    Shipping rates describe the price of shipping presented to your customers and applied to a purchase.
- aid: stripe:stripe-sigma-api
  name: Stripe Sigma API
  tags:
  - Sigma
  properties:
  - url: https://stripe.com/docs/api/sigma/scheduled_queries
    type: Documentation
  - url: openapi/stripe-sigma-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-sigma-overlay.yaml
    type: Overlay
  description: >-
    If you have scheduled a Sigma query, you'll receive a sigma.scheduled_query_run.created webhook each
    time the query runs. The webhook contains a ScheduledQueryRun object, which you can use to retrieve
    the query results.
- aid: stripe:stripe-sources-api
  name: Stripe Sources API
  tags:
  - Sources
  - Transactions
  properties:
  - url: https://stripe.com/docs/api/sources
    type: Documentation
  - url: openapi/stripe-sources-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-sources-overlay.yaml
    type: Overlay
  description: >-
    Source objects allow you to accept a variety of payment methods. They represent a customer's payment
    instrument, and can be used with the Stripe API just like a Card object once chargeable, they can
    be charged, or can be attached to customers.
- aid: stripe:stripe-tax-api
  name: Stripe Tax API
  tags:
  - Taxes
  properties:
  - url: https://stripe.com/docs/tax
    type: Documentation
  - url: openapi/stripe-tax-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-tax-overlay.yaml
    type: Overlay
  description: >-
    Automate sales tax, VAT, and GST compliance on all your transactions-low or no code integrations available.
- aid: stripe:stripe-terminal-api
  name: Stripe Terminal API
  tags:
  - Point of Sale
  - Terminal
  - Terminals
  properties:
  - url: https://stripe.com/docs/terminal
    type: Documentation
  - url: openapi/stripe-terminal-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-terminal-overlay.yaml
    type: Overlay
  description: >-
    Use Stripe Terminal to accept in-person payments and extend Stripe payments to your point of sale.
- aid: stripe:stripe-test-helpers-api
  name: Stripe Test Helpers API
  tags:
  - Synthetic
  - Testing
  - Virtualization
  properties:
  - url: https://stripe.com/docs/implementation-guides/billing/testing
    type: Documentation
  - url: openapi/stripe-test-helpers-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-test-helpers-overlay.yaml
    type: Overlay
  description: >-
    Stripe provides a number of resources for testing your integration. Make sure to test the following
    use cases before launch, and use our Postman collection to make the testing process simpler.
- aid: stripe:stripe-tokens-api
  name: Stripe Tokens API
  tags:
  - Tokens
  properties:
  - url: https://stripe.com/docs/api/tokens
    type: Documentation
  - url: https://docs.stripe.com/api/tokens
    type: APIReference
  - url: openapi/stripe-tokens-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-tokens-overlay.yaml
    type: Overlay
  description: >-
    Tokenization is the process Stripe uses to collect sensitive card or bank account details, or personally
    identifiable information (PII), directly from your customers in a secure manner. A token representing
    this information is returned to your server to use. Use our recommended payments integrations to perform
    this process on the client-side. This guarantees that no sensitive card data touches your server,
    and allows your integration to operate in a PCI-compliant way.
- aid: stripe:stripe-topups-api
  name: Stripe Topups API
  tags:
  - Topups
  properties:
  - url: https://stripe.com/docs/api/topups
    type: Documentation
  - url: https://docs.stripe.com/api/topups
    type: APIReference
  - url: openapi/stripe-topups-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-topups-overlay.yaml
    type: Overlay
  description: >-
    To top up your Stripe balance, you create a top-up object. You can retrieve individual top-ups, as
    well as list all top-ups. Top-ups are identified by a unique, random ID.
- aid: stripe:stripe-transfers-api
  name: Stripe Transfers API
  tags:
  - Transfers
  properties:
  - url: https://stripe.com/docs/api/transfers
    type: Documentation
  - url: https://docs.stripe.com/api/transfers
    type: APIReference
  - url: openapi/stripe-transfers-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-transfers-overlay.yaml
    type: Overlay
  description: >-
    A Transfer object is created when you move funds between Stripe accounts as part of Connect.
- aid: stripe:stripe-treasury-api
  name: Stripe Treasury API
  tags:
  - Treasury
  properties:
  - url: https://stripe.com/docs/treasury
    type: Documentation
  - url: openapi/stripe-treasury-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-treasury-overlay.yaml
    type: Overlay
  description: >-
    Stripe Treasury is a banking-as-a-service API that lets you embed financial services in your product.
    With Stripe's API, you can enable businesses to hold funds, pay bills, earn yield, and manage their
    cash flow. Many users build Stripe Issuing in conjunction with Stripe Treasury to attach cards to
    spend funds in the account.
- aid: stripe:stripe-connect-api
  name: Stripe Connect API
  tags:
  - Connect
  - Marketplaces
  - Platforms
  properties:
  - url: https://docs.stripe.com/connect
    type: Documentation
  - url: https://docs.stripe.com/api/connected-accounts
    type: APIReference
  - url: openapi/stripe-connect-api-openapi.yml
    type: OpenAPI
  - url: overlays/stripe-connect-overlay.yaml
