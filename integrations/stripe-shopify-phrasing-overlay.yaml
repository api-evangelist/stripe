overlay: 1.0.0
info:
  title: API Evangelist conversational phrasing for the Stripe + Shopify checkout integration
  version: 1.0.0
extends: integrations/stripe-shopify.yml
actions:
- target: $.workflows[?(@.workflowId == 'stripe-shopify-checkout')]
  update:
    x-apievangelist-phrasing:
      intent: Take Stripe payments for Shopify orders
      outcome: A Shopify sale is paid through Stripe and recorded as an order in the store, even where Shopify Payments is unavailable.
      effect: write
      stakeholders:
      - ecommerce manager
      - founder
      - finance operations
      - developer
      connects:
        from:
          provider: stripe
          capability: BC-1340.10 Payment Initiation Management
          tag: Payment Intents
        to:
          provider: shopify
          capability: BC-520.40 Order Fulfilment Management
          tag: Orders
      questions:
      - How do I take payment with Stripe on my Shopify store if Shopify Payments is not available in my country?
      - Can a Stripe payment create the matching order in Shopify?
      - How do I keep Shopify orders and Stripe payments in step?
      instructions:
      - text: Charge {amount} {currency} through Stripe and record a Shopify order for {customer_email}.
      - text: Create a Shopify order for {line_item_quantity} x {line_item_title} at {line_item_price}, paid via Stripe.
      - text: Collect {amount} in {currency} with Stripe and log the sale in Shopify for {customer_email}.
