arazzo: 1.0.1
info:
  title: Add New Stripe Customers as Trainerize Clients
  summary: Create or update an ABC Trainerize client for each new Stripe customer.
  description: Retrieves a newly created Stripe customer and adds or updates the matching client in ABC Trainerize.
    Recreates the Zapier template "Add new Stripe customers as Trainerize clients".
  version: 1.0.0
sourceDescriptions:
- name: stripeCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/stripe/refs/heads/main/openapi/stripe-customers-api-openapi.yml
  type: openapi
- name: trainerizeClientsApi
  url: https://raw.githubusercontent.com/api-evangelist/trainerize/refs/heads/main/openapi/trainerize-clients-api-openapi.yml
  type: openapi
workflows:
- workflowId: stripe-trainerize-new-customer-clients
  summary: Create or update an ABC Trainerize client for each new Stripe customer.
  description: Retrieves a newly created Stripe customer and adds or updates the matching client in ABC Trainerize.
    Recreates the Zapier template "Add new Stripe customers as Trainerize clients".
  inputs:
    type: object
    properties:
      customerId:
        type: string
        description: Stripe customer id (cus_...) from the customer.created event.
    required:
    - customerId
  steps:
  - stepId: get-stripe-customer
    description: Retrieve the new Stripe customer.
    operationId: $sourceDescriptions.stripeCustomersApi.GetCustomersCustomer
    parameters:
    - name: customer
      in: path
      value: $inputs.customerId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/email
      name: $response.body#/name
      phone: $response.body#/phone
      customerId: $response.body#/id
  - stepId: add-trainerize-client
    description: Add or update the Trainerize client.
    operationId: $sourceDescriptions.trainerizeClientsApi.addOrUpdateClient
    requestBody:
      contentType: application/json
      payload:
        email: $steps.get-stripe-customer.outputs.email
        firstName: $steps.get-stripe-customer.outputs.name
        phone: $steps.get-stripe-customer.outputs.phone
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      result: $response.body
  outputs:
    email: $steps.get-stripe-customer.outputs.email
    trainerizeResult: $steps.add-trainerize-client.outputs.result
