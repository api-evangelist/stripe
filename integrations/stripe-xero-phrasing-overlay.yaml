# Generated by API Evangelist. Our phrasing, not observed demand (roadmap#949).
# Every {slot} is an input of the workflow; the capabilities come from stripe-integration-map.yml.
overlay: 1.0.0
info:
  title: API Evangelist conversational phrasing for the Stripe + Xero payout reconciliation integration
  version: 1.0.0
extends: integrations/stripe-xero.yml
actions:
- target: $.workflows[?(@.workflowId == 'stripe-xero-reconcile-payouts')]
  update:
    x-apievangelist-phrasing:
      intent: Reconcile Stripe payouts in Xero
      outcome: Money paid out from Stripe shows up as a bank transaction in Xero, ready to reconcile against the bank account.
      effect: write
      stakeholders:
      - bookkeeper
      - controller
      - finance operations
      - small-business owner
      connects:
        from:
          provider: stripe
          capability: BC-1340 Payments & Card Management
          tag: Payouts
        to:
          provider: xero
          capability: BC-200 Financial Management
          tag: Accounting
      questions:
      - How do I reconcile Stripe payouts in Xero?
      - Can Xero record a bank transaction for each Stripe payout?
      - How do I match money arriving from Stripe against my Xero bank account?
      instructions:
      - text: Record the latest {status} Stripe payout in Xero as a {bankTransactionType} bank transaction to account {accountID}.
      - text: Create a Xero bank transaction for {unitAmount} against account code {accountCode} for contact {contactID}.
      - text: Reconcile up to {limit} Stripe payouts in Xero with the line {lineDescription}.
      method: generated
      generated: '2026-10-12'
      generator: payments-integration-phrasing
