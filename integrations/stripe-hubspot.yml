arazzo: 1.0.1
info:
  title: Push Stripe successful charges as HubSpot deals
  summary: Sync a successful Stripe charge into HubSpot as a Closed Won deal.
  description: When a Stripe charge succeeds, retrieve the charge, look up the matching HubSpot Contact, and create
    a HubSpot Deal in the Closed Won stage using the charge amount and currency. This replicates the legacy Naftiko
    integration that pushed successful Stripe payments into HubSpot CRM as won revenue.
  version: 1.0.0
sourceDescriptions:
- name: stripeChargesApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/stripe/refs/heads/main/openapi/stripe-charges-api-openapi.yml
  type: openapi
- name: hubspot
  url: https://raw.githubusercontent.com/api-evangelist/hubspot/refs/heads/main/openapi/hubspot-basic-api-openapi.yml
  type: openapi
- name: hubspotContacts
  url: https://raw.githubusercontent.com/api-evangelist/hubspot/refs/heads/main/openapi/hubspot-basic-api-openapi.yml
  type: openapi
workflows:
- workflowId: stripe-hubspot-sync-charge-to-deal
  summary: Create a HubSpot Closed Won deal from a successful Stripe charge.
  description: Retrieve a Stripe charge by ID, fetch the associated HubSpot Contact, and create a Closed Won HubSpot
    Deal carrying the charge amount and currency.
  inputs:
    type: object
    required:
    - chargeId
    - contactId
    properties:
      chargeId:
        type: string
        description: The Stripe charge ID that succeeded (e.g. ch_123).
      contactId:
        type: string
        description: The HubSpot Contact ID to attach the deal to.
      dealName:
        type: string
        description: Name to give the created HubSpot deal.
        default: Stripe Charge
  steps:
  - stepId: retrieve-stripe-charge
    description: Retrieve the successful Stripe charge to sync.
    operationId: $sourceDescriptions.stripeChargesApiOpenapi.GetChargesCharge
    parameters:
    - name: charge
      in: path
      value: $inputs.chargeId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      chargeId: $response.body#/id
      amount: $response.body#/amount
      currency: $response.body#/currency
      status: $response.body#/status
  - stepId: get-hubspot-contact
    description: Look up the matching HubSpot contact for this charge.
    operationId: $sourceDescriptions.hubspotContacts.get-/crm/objects/2026-03/contacts/{contactId}_getById
    parameters:
    - name: contactId
      in: path
      value: $inputs.contactId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      contactId: $response.body#/id
    x-remapped-by-meaning:
      from: $sourceDescriptions.hubspotContacts.getContact
      to: $sourceDescriptions.hubspotContacts.get-/crm/objects/2026-03/contacts/{contactId}_getById
      spec: hubspot-basic-api-openapi.yml
      evidence: GET /crm/objects/2026-03/contacts/{contactId} — summary "Retrieve a contact"; description "Retrieve
        a contact by its ID (`contactId`) or by a unique property (`idProperty`)." — the only single-contact read
        in hubspot openapi/
      date: '2026-10-14'
  - stepId: create-hubspot-deal
    description: Create a Closed Won HubSpot deal from the Stripe charge.
    operationId: $sourceDescriptions.hubspot.post-/crm/objects/2026-03/0-3_create
    requestBody:
      contentType: application/json
      payload:
        properties:
          dealname: $inputs.dealName
          amount: $steps.retrieve-stripe-charge.outputs.amount
          dealstage: closedwon
          deal_currency_code: $steps.retrieve-stripe-charge.outputs.currency
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      dealId: $response.body#/id
      createdAt: $response.body#/createdAt
    x-remapped-by-meaning:
      from: $sourceDescriptions.hubspot.createDeal
      to: $sourceDescriptions.hubspot.post-/crm/objects/2026-03/0-3_create
      spec: hubspot-basic-api-openapi.yml
      evidence: POST /crm/objects/2026-03/0-3 — summary "Create"; description "Create a deal with the given properties
        and return a copy of the object, including the ID." — the only single-deal create (batch/create is the batch
        form)
      date: '2026-10-14'
  outputs:
    chargeId: $steps.retrieve-stripe-charge.outputs.chargeId
    contactId: $steps.get-hubspot-contact.outputs.contactId
    dealId: $steps.create-hubspot-deal.outputs.dealId
x-integration:
  guessed_steps:
  - step: get-hubspot-contact
    cause: remapped-by-meaning
    why: getContact is not an operationId in any current hubspot openapi/ file (spec hubspot-crm-contacts-api-openapi.yml
      was renamed/split by refine and the operation was not carried under that id)
    was_cause: partner-contract
    remapped: $sourceDescriptions.hubspotContacts.getContact -> get-/crm/objects/2026-03/contacts/{contactId}_getById
      (hubspot-basic-api-openapi.yml) by meaning, not an exact operationId match
  - step: create-hubspot-deal
    cause: remapped-by-meaning
    why: createDeal is not an operationId in any current hubspot openapi/ file (spec hubspot-crm-deals-api-openapi.yml
      was renamed/split by refine and the operation was not carried under that id)
    was_cause: partner-contract
    remapped: $sourceDescriptions.hubspot.createDeal -> post-/crm/objects/2026-03/0-3_create (hubspot-basic-api-openapi.yml)
      by meaning, not an exact operationId match
