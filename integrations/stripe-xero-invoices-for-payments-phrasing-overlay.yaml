# Generated by API Evangelist. Our phrasing, not observed demand (roadmap#949, pilot).
# Conversational phrasing for an INTEGRATION: the language business stakeholders use for what this
# workflow gets done. Same x-apievangelist-phrasing shape as the per-operation overlays, plus what only
# an integration has: the roles who ask for it, the outcome, and the two capabilities it connects.
# Every {slot} is an input of the workflow; the capabilities come from stripe-integration-map.yml.
overlay: 1.0.0
info:
  title: API Evangelist conversational phrasing for the Stripe + Xero invoice integration
  version: 1.0.0
extends: integrations/stripe-xero-invoices-for-payments.yml
actions:
  - target: $.workflows[?(@.workflowId == 'stripe-xero-invoices-for-payments')]
    update:
      x-apievangelist-phrasing:
        intent: Record Stripe payments as invoices in Xero
        outcome: Every payment taken through Stripe appears in the books as an invoice, without re-keying.
        effect: write
        stakeholders: [finance operations, bookkeeper, controller, small-business owner]
        connects:
          from: {provider: stripe, capability: BC-1340.70 Card Transaction Processing Management, tag: Charges}
          to: {provider: xero, capability: Financial Management, tag: Accounting}
        questions:
          - How do I get my Stripe sales into Xero automatically?
          - Can Xero create an invoice every time a customer pays through Stripe?
          - How do I keep my accounting in step with Stripe payments without exporting CSVs?
        instructions:
          - text: Create a Xero invoice for Stripe payment {chargeId}.
          - text: Invoice contact {contactID} in Xero for Stripe charge {chargeId} against account {accountCode}.
          - text: Record Stripe charge {chargeId} as {unitAmount} on a Xero invoice for tenant {xeroTenantId}.
        method: generated
        generated: '2026-10-12'
        generator: hand pilot (integration phrasing, roadmap#949)
