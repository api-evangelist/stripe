      - text: Verify {customerId} in Stigg environment {stiggEnvironmentId} and start a {mode} checkout for {quantity} of {priceId}.
      - text: Open Stripe Checkout for {customerId} on {priceId}, returning to {successUrl} or {cancelUrl}.
