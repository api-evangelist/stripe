arazzo: 1.0.1
info:
  title: Turn New Stripe Customers into Brevo Contacts
  summary: Create a Brevo contact for each new Stripe customer.
  description: Retrieves a newly created Stripe customer and creates a matching Brevo (formerly Sendinblue) contact,
    optionally adding it to lists. Recreates the Zapier template "Turn new Stripe customers into SendinBlue contacts".
  version: 1.0.0
sourceDescriptions:
- name: stripeCustomersApi
  url: https://raw.githubusercontent.com/api-evangelist/stripe/refs/heads/main/openapi/stripe-customers-api-openapi.yml
  type: openapi
- name: brevoContactsApi
  url: https://raw.githubusercontent.com/api-evangelist/brevo/refs/heads/main/openapi/brevo-contacts-api-openapi.yml
  type: openapi
workflows:
- workflowId: stripe-brevo-new-customer-contacts
  summary: Create a Brevo contact for each new Stripe customer.
  description: Retrieves a newly created Stripe customer and creates a matching Brevo (formerly Sendinblue) contact,
    optionally adding it to lists. Recreates the Zapier template "Turn new Stripe customers into SendinBlue contacts".
  inputs:
    type: object
    properties:
      customerId:
        type: string
        description: Stripe customer id (cus_...) from the customer.created event.
      listIds:
        type: array
        items:
          type: integer
        description: Brevo list ids to add the contact to.
    required:
    - customerId
  steps:
  - stepId: get-stripe-customer
    description: Retrieve the new Stripe customer.
    operationId: $sourceDescriptions.stripeCustomersApi.GetCustomersCustomer
    parameters:
    - name: customer
      in: path
      value: $inputs.customerId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      email: $response.body#/email
      name: $response.body#/name
      phone: $response.body#/phone
      customerId: $response.body#/id
  - stepId: create-brevo-contact
    description: Create the Brevo contact.
    operationId: $sourceDescriptions.brevoContactsApi.createContact
    requestBody:
      contentType: application/json
      payload:
        email: $steps.get-stripe-customer.outputs.email
        attributes:
          FIRSTNAME: $steps.get-stripe-customer.outputs.name
          STRIPE_ID: $steps.get-stripe-customer.outputs.customerId
        listIds: $inputs.listIds
        updateEnabled: true
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      contactId: $response.body#/id
  outputs:
    email: $steps.get-stripe-customer.outputs.email
    brevoContactId: $steps.create-brevo-contact.outputs.contactId
x-integration:
