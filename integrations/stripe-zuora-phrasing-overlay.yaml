          to: {provider: stripe, capability: BC-1340.10 Payment Initiation Management, tag: Payment Intents}
        questions:
          - How do I check which Stripe payment paid a Zuora invoice?
          - Can I see a Zuora invoice's balance alongside the customer's Stripe payments?
          - How do I reconcile Zuora billing against what Stripe actually collected?
        instructions:
          - text: Show me Zuora invoice {invoiceKey} next to the Stripe payments for customer {stripeCustomerId}.
          - text: Pull invoice {invoiceKey} from Zuora and list up to {limit} Stripe payments for {stripeCustomerId}.
          - text: Help me reconcile Zuora invoice {invoiceKey} against Stripe customer {stripeCustomerId}.
        method: generated
