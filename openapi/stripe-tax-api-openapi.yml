                  type: object
                type:
                  enum:
                  - ioss
                  - oss_non_union
                  - oss_union
                  - standard
                  type: string
              required:
              - type
              title: europe
              type: object
            bg:
              properties:
                standard:
                  properties:
                    place_of_supply_scheme:
                      enum:
                      - small_seller
